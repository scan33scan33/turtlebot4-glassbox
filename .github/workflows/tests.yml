name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite drives a simulated base in real time (~3 min); give it headroom.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # No ROS 2 here on purpose: the tests stub the ROS message packages and
      # import the navigator for real, so they run on a stock runner.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Globbed from git, not enumerated: a hand-maintained file list silently
      # stops covering any new file (and breaks outright when one is moved).
      - name: Compile every Python file
        run: |
          git ls-files -z '*.py' | xargs -0 -r python -m compileall -q

      - name: Check shell scripts parse
        run: |
          while IFS= read -r f; do
            bash -n "$f" && echo "ok  $f"
          done < <(git ls-files '*.sh')

      - name: Parse every .toy program
        run: |
          python - <<'PY'
          import glob, sys, toyscript
          bad = 0
          for p in sorted(glob.glob('programs/*.toy')):
              try:
                  with open(p) as fh:
                      toyscript.Parser(toyscript.tokenize(fh.read())).parse()
                  print(f'ok    {p}')
              except Exception as e:
                  print(f'FAIL  {p}: {e}'); bad = 1
          sys.exit(bad)
          PY

      - name: Run the closed-loop push tests
        run: python tests/test_push_to_goal.py

      - name: DSL smoke run against MockRobot
        run: python toyscript.py programs/push_ball_to_goal.toy
